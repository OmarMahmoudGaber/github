name: my second workflow | training 

on:
  push:
    branches:
      - main

jobs:
  first_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2

      - name: List files
        run: ls -ltra

      - name: Run shell script
        run: |
          # Create the file on the fly if it's missing
          echo "echo 'Hello from the script!'" > script22.sh
          
          # Now change permissions and run it
          chmod +x script22.sh
          ./script22.sh
          
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final
          path: dragon.txt
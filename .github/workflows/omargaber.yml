name: my Third workflow | training 

on:
  push:
    branches:
      - main

jobs:
  first_job:
    runs-on: ubuntu-latest
    
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}